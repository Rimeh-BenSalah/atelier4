name: Publier une image Docker par tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag Git à publier"
        required: true
        default: "v1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Configurer Docker
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rimeh-bensalah/campus-tasks:${{ inputs.version }}
